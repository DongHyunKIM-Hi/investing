services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ggeol
      POSTGRES_PASSWORD: ggeol
      POSTGRES_DB: ggeol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggeol"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
